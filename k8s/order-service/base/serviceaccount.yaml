# IRSA: this ServiceAccount maps to the IAM role "<env>-order-service" (Terraform: aws_iam_role.irsa),
# which may ONLY read the Aurora secret. No AWS keys exist anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  annotations:
    eks.amazonaws.com/role-arn: REPLACED_BY_OVERLAY
automountServiceAccountToken: false
