# Default-deny for the namespace, then allow only the flows order-service needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: order-service }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:                                   # ALB (IP target mode) from the public subnets
        - ipBlock: { cidr: 10.30.0.0/24 }
        - ipBlock: { cidr: 10.30.1.0/24 }
        - ipBlock: { cidr: 10.30.2.0/24 }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: web } }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to:                                     # CoreDNS
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:                                     # Aurora in the data subnets
        - ipBlock: { cidr: 10.30.200.0/22 }
      ports: [{ port: 3306, protocol: TCP }]
    - to:                                     # inventory service
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: inventory } }
      ports: [{ port: 8080, protocol: TCP }]
    - to:                                     # payment API only through its internal gateway (mTLS)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: payment } }
          podSelector: { matchLabels: { app.kubernetes.io/name: payment-gateway } }
      ports: [{ port: 8443, protocol: TCP }]
    - to:                                     # AWS APIs via VPC interface endpoints (Secrets Manager, STS)
        - ipBlock: { cidr: 10.30.16.0/20 }
        - ipBlock: { cidr: 10.30.32.0/20 }
        - ipBlock: { cidr: 10.30.48.0/20 }
      ports: [{ port: 443, protocol: TCP }]
