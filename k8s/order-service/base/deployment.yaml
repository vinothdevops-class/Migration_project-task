apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: order-management }
spec:
  replicas: 3                      # HPA owns this after first apply
  revisionHistoryLimit: 10         # keeps old ReplicaSets for `kubectl rollout undo`
  selector:
    matchLabels: { app.kubernetes.io/name: order-service }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # add one new pod at a time
      maxUnavailable: 0            # never drop below desired capacity -> zero downtime
  template:
    metadata:
      labels: { app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: order-management }
    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: true   # needed for the IRSA projected token only; no K8s RBAC is bound
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
      nodeSelector:
        eks.amazonaws.com/nodegroup: general
      containers:
        - name: order-service
          image: ORDER_SERVICE_IMAGE          # set to repo@sha256:<digest> by the pipeline (kustomize images)
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: order-service-config }
          env:
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests: { cpu: 250m, memory: 256Mi }   # what the scheduler reserves; HPA % is relative to this
            limits:   { cpu: "1",  memory: 512Mi }   # memory limit = OOM guard; CPU limit caps noisy neighbours
          startupProbe:                               # gives slow cold starts (secret fetch + pool) up to 60 s
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:                              # process-level only: no DB check, avoids restart storms
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:                             # DB reachable? if not, pod leaves the Service/ALB
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:                                  # let ALB deregistration catch up before SIGTERM drain
              sleep: { seconds: 15 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
