# Payment namespace: deny everything, then allow only order-service in and the processor out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: payment }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: payment-service, namespace: payment }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: payment-service }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: orders } }
          podSelector: { matchLabels: { app.kubernetes.io/name: order-service } }
      ports: [{ port: 8443, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:                                   # payment DB only (separate Aurora cluster / subnet)
        - ipBlock: { cidr: 10.30.204.0/24 }
      ports: [{ port: 3306, protocol: TCP }]
    - to:                                   # egress proxy that allow-lists the card processor's hostnames
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress } }
      ports: [{ port: 3128, protocol: TCP }]
